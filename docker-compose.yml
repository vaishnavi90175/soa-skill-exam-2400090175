
name: asset-management-deployment

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: soa-skill-exam-2400090175
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asset-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./AssetService
    image: docker-skill-exam-2400090175:latest
    container_name: asset-backend
    ports:
      - "175:2000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - asset-network

volumes:
  postgres_data:

networks:
  asset-network:
    driver: bridge
